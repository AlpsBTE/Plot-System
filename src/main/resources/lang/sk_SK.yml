      stage-3-messages:
        - 'Obrysy budovy sa generujú automaticky, ale keďže väčšinou nie sú presné, musíme ich opraviť. Na opravu obrysov sa najprv musíme teleportovať na rohy budovy.'
        - 'Použi príkaz {0} na teleportáciu na miesto v hre. Použi {1} na jednom z okrajov budovy na skopírovanie súradníc.'
        - '{2}'
        - 'Pre pokračovanie sa teleportuj na označené body. Skús to znova!'
        - 'Prepni na §6Satelitný§f pohľad v Google Maps na zobrazenie budovy v 3D.%newline%%newline%Klikni na §6Vrstvy§f vľavo dole na mape. Ak sa 3D budovy nezobrazia, zapni §6Zobrazenie glóbusu§f v ponuke "Viac".'
