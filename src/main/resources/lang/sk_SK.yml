      stage-7-title: 'Plášť budovy'
      stage-7-messages:
        - 'Teraz už konečne môžeme začať stavat! Prvým krokom je plášť budovy, ktorý začneme podla obrysov a výšky.'
        - 'Teleportuj sa aspoň na §6jeden bod§f hrebeňa strechy a §6prepoj§f ho s fasádou.'
        - 'Používaj §6rôzne typy§f blokov a farieb pre hrubú stavbu, aby bolo ľahšie §6rozdeliť§f budovu na časti.'
        - 'Ďalej vztyčíme steny a uzavrieme strechu. Teraz je čas vyznačiť okná a dvere.'
        - 'Použi príkaz WorldEditu §6{0}§f na rýchle a jednoduché vztyčenie stien.'
        - 'Strechu vyplň ručne alebo použi príkaz WorldEditu §6{1}§f. Prípadne použi príkaz §6{2}§f na zmenu výberu pri väčších a zložitejších strechách.'
        - 'Vždy kontroluj §6výšku§f okien a dverí, aby §6zodpovedala§f fasáde.'
      stage-7-tasks:
        - 'Prečítaj si všetky tipy na parcele a označ ich ako prečítané.'
    stage-8:
      stage-8-title: 'Okná'
      stage-8-messages:
        - 'Plášť budovy je hotový! Poďme na okná a dvere.'
        - 'Aha... vyzerá to, že chýbajú dve okná. Pomôžeš mi ich umiestniť? Vyzerajú rovnako ako tie na pravej strane.'
        - 'Nezabudni §6stmaviť§f §6okná§f a §6dvere§f, aby cez ne nebolo vidieť dovnútra. Interiéry nestaviame!'
        - 'Existuje mnoho spôsobov, ako v BTE stavat okná, napríklad pomocou §6zástav§f, §6poklopov§f alebo §6kobercov§f.'
        - 'Použi rovnaké bloky ako pri oknách na pravej strane. Skús to znova!'
        - 'Ďakujem za pomoc! Teraz môžeme pokračovať tvorbou textúr.'
      stage-8-tasks:
        - 'Umiestni chýbajúce detaily okien.'
    stage-9:
      stage-9-title: 'Textúrovanie'
      stage-9-messages:
        - 'Textúrovanie je neodmysliteľnou súčasťou stavania. Správny výber blokov a farieb je kľúčový pre to, aby budova pôsobila realisticky.'
        - 'Pre správny výber blokov použi §6Google Street View§f alebo §6fotografie§f, keďže letecké snímky bývajú niekedy nepresné.'
        - 'Pomocou príkazu WorldEditu §6{0}§f ľahko nahradíš plášť budovy svojou textúrou.'
        - 'Na steny a strechu sa snaž používať §6kombinácie blokov§f a §6prechody§f, aby budova vyzerala realistickejšie a viac vynikla.'
      stage-9-tasks:
        - 'Prečítaj si všetky tipy na parcele a označ ich ako prečítané.'
    stage-10:
      stage-10-title: 'Dotváranie detailov a ďalšie kroky'
      stage-10-messages:
        - 'Pridávanie detailov je jedným z najdôležitejších krokov, pretože dáva budove osobitý a jedinečný vzhľad.'
        - 'Pridajte do svojich stavieb §6vlastné bannery§f a §6unikátne hlavy§f. Použite príkaz §6{0}§f a získajte široký výber unikátnych hláv.'
        - 'Existuje mnoho spôsobov, ako §6ozdobiť§f budovy. Vždy venuj pozornosť detailom na fasáde a strechách, ako sú §6komíny§f, §6okná§f a §6odpadvé žľaby§f.'
        - 'Ďakujeme za účasť! Teraz môžeš začať vytvárať vlastné budovy pre projekt BuildTheEarth.'
        - 'Kliknutím sem sa dozvieš viac o projekte.'
        - 'Ak sa chceš <gold>prihlásiť ako staviteľ</gold>, vytvor a odovzdaj <gold>jeden alebo viac pozemkov</gold> na našom serveri. Viac informácií o procese prihlásenia nájdeš na našom webe alebo {1}.'
        - 'Ak si chceš pozrieť aktuálny pokrok na mape, navštív server Terra!'
        - 'Príjemné stavanie! ☺'
      stage-10-tasks:
        - 'Prečítaj si všetky tipy na parcele a označ ich ako prečítané.'
