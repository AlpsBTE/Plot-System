    stage-1:
      stage-1-title: 'Porozumění projektu BuildTheEarth'
      stage-1-messages:
        - 'Ahoj {0}! Rád tě poznávám, jmenuji se {1}. Právě jsi vstoupil/a do vzrušujícího světa projektu BuildTheEarth!'
        - 'Naším cílem je přetvořit celou planetu Zemi v Minecraftu v měřítku 1:1. Ano, slyšíš správně, v měřítku 1:1!'
        - 'My v Alps BTE jsme však zodpovědní pouze za přetvoření krásných alpských zemí, Rakouska, Švýcarska a Lichtenštejnska.'
        - 'Jsi připraven/a naučit se stavět pro BTE? Provedu tě základy potřebnými pro účast v projektu. Jdeme na to!'
      stage-1-tasks:
        - 'Promluv si s {0}em na staveništi.'
    stage-2:
      stage-2-title: 'Podklady'
      stage-2-messages:
        - 'Vítej na svém malém ostrově. Zde postavíme naši první budovu!'
        - 'Než začneme stavět, musíme vědět, jak budova vypadá ve skutečnosti. K tomu používáme nástroje jako {0} a {1}.'
        - 'Pomocí {2} kopírujeme souřadnice, abychom se mohli teleportovat na konkrétní místo. Kromě toho máme přístup k {3}, kde si můžeme budovu prohlédnout zblízka.'
        - '{4}'
        - 'Pro změření výšky budovy používáme {5}. Je důležité, aby budova měla správnou výšku.'
        - '{6}'
        - 'Pokud budeš odkazy potřebovat později, použij příkaz {7}.'
      stage-2-tasks:
    stage-3:
      stage-3-title: 'Teleportace'
      stage-3-messages:
        - 'Obrysy budovy se generují automaticky, ale protože většinou nejsou přesné, musíme je opravit. Pro opravu obrysů se nejprve musíme teleportovat na rohy budovy.'
        - 'Použij příkaz {0} k teleportaci na místo ve hře. Použij {1} na jednom z okrajů budovy pro zkopírování souřadnic.'
        - '{2}'
        - 'Pro pokračování se teleportuj na označené body. Zkus to znovu!'
        - 'Přepni na §6Satelitní§f pohled v Google Maps pro zobrazení budovy ve 3D.%newline%%newline%Klikni na §6Vrstvy§f vlevo dole na mapě. Pokud se 3D budovy nezobrazí, zapni §6Zobrazení glóbu§f v nabídce "Více".'
      stage-3-tasks:
        - 'Teleportuj se na všechny {0} rohy budovy pomocí {1}.'
    stage-4:
      stage-4-title: 'WorldEdit'
      stage-4-messages:
        - 'Než budeme pokračovat v obrysech, musíme se seznámit s důležitým nástrojem {0}. WorldEdit nám umožňuje stavět rychleji a efektivněji.'
        - 'Pro práci s WorldEditem potřebuješ <gold>dřevěnou sekeru</gold>.'
        - 'Nyní, když máš dřevěnou sekeru, můžeš provést výběr pomocí {1} a {2} na bloky.'
      stage-4-tasks:
        - 'Použij příkaz {0} pro získání dřevěné sekery.'
