      stage-6-messages:
        - 'Now that we have the building outlines, we need to <gold>measure</gold> the height of the building.'
        - '计算 <gold>面的</gold> 面的高度，减去 <gold>地面</gold> <gold>顶</gold> 的高度。'
        - '在聊天中输入建筑面的高度(以米为单位)以继续。'
