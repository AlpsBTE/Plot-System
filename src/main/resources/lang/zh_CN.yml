        - '我们使用 {5} 来测量建筑物的高度。这很重要，所以建筑物的高度是正确的。'
        - '{6}'
        - '如果您稍后需要链接，请使用命令 {7}。'
      stage-2-tasks:
    stage-3:
      stage-3-title: '传送中'
      stage-3-messages:
        - '建筑轮廓默认情况下生成，但由于它们大多不准确，我们必须加以纠正。 为了纠正轮廓，我们首先需要传送到大楼的边缘。'
        - '使用命令 {0} 传送到游戏中的位置。在建筑物边缘上的 {1} 复制坐标。'
        - '{2}'
        - '继续传送到标记点。再试一次！'
        - 'Switch to §6Satellite§f view in Google Maps to show the building in 3D.%newline%%newline%Click on §6Layers§f at the bottom left of the map. If no 3D buildings appear, enable the §6Globe View§f under "More".'
