        - '使用 {1} 传送到建筑物所有的 {0} 边缘。'
    stage-4:
      stage-4-title: '世界编辑'
      stage-4-messages:
        - '在我们继续提纲之前，我们需要知道一个叫做 {0}的重要工具。世界编辑使我们能够更快和更有效地建立起来。'
        - '要使用 WorldEdit，您需要得到一个 <gold>木斧</gold>。'
        - '现在你有了你的木斧，你可以在方块上 {1} 和 {2} 进行选择。'
      stage-4-tasks:
        - '使用命令 {0} 获取你的木轴。'
    stage-5:
