tutorials:
  stage: 'Fase'
  new-stage-unlocked: 'NUOVO STAGE SBLOCCATO'
  tutorial-completed: 'TUTORIALE COMPLETATO'
  beginner:
    stage-1:
      stage-1-title: 'Comprendere il progetto BuildTheEarth'
      stage-1-messages:
        - 'Ciao {0}! Bel per incontrarti, il mio nome è {1}. Ti sei appena imbattuto nell''entusiasmante mondo del progetto BuildTheEarth!'
        - 'La nostra missione è ricreare l''intero pianeta Terra in Minecraft in scala 1:1. Sì, hai sentito bene, in scala 1:1!'
        - 'Tuttavia, le Alpi BTE sono responsabili solo di ricreare i bellissimi paesi alpini di Austria, Svizzera e Liechtenstein.'
        - 'Sei pronto a imparare a costruire per il BTE? Ti guiderò attraverso le basi per partecipare al progetto. Lascia che continui così!'
      stage-1-tasks:
        - 'Parla con {0} nel cantiere.'
    stage-2:
      stage-2-title: 'Riferimenti'
      stage-2-messages:
        - 'Benvenuto sulla tua piccola isola. Qui costruiremo il nostro primo edificio per il progetto Costruisci la Terra!'
        - 'Prima di iniziare a costruire, dobbiamo sapere come appare l''edificio della vita reale. Per questo utilizziamo strumenti come {0} e {1}.'
        - 'Usiamo {2} per copiare le coordinate, così possiamo teletrasportarci in un punto specifico. Inoltre possiamo accedere a {3} per avere un''occhiata più da vicino all''edificio.'
        - '{4}'
        - 'Usiamo {5} per misurare l''altezza dell''edificio. Questo è importante sapere, quindi l''edificio ha l''altezza corretta.'
        - '{6}'
        - 'Utilizzare il comando {7} se hai bisogno dei collegamenti più tardi.'
      stage-2-tasks:
    stage-3:
      stage-3-title: 'Teletrasporto'
      stage-3-messages:
        - 'I contorni dell''edificio sono generati per impostazione predefinita, ma poiché non sono per lo più accurati, dobbiamo correggerli. Per correggere i contorni dobbiamo innanzitutto teletrasportarci ai bordi dell''edificio.'
        - 'Usa il comando {0} per teletrasportarti nella posizione in gioco. {1} su uno dei bordi dell''edificio per copiare le coordinate.'
        - ''
        - 'Per continuare a teletrasportarti nei punti contrassegnati. Riprova!'
        - 'Passa alla vista §6Satellite§f su Google Maps per mostrare l''edificio in 3D.%newline%%newline%Clecca su §6Livelli§f in basso a sinistra della mappa. Se non vengono visualizzati edifici 3D, abilita la vista §6Globe§f sotto "Altro".'
      stage-3-tasks:
        - 'Teletrasportati a tutti i bordi {0} dell''edificio utilizzando {1}.'
    stage-4:
      stage-4-title: 'WorldEdit'
      stage-4-messages:
        - 'Prima di continuare con i contorni, abbiamo bisogno di conoscere un importante strumento chiamato {0}. WorldEdit ci permette di costruire più velocemente ed efficientemente.'
        - 'Per poter utilizzare WorldEdit, è necessario ottenere un''ascia di legno <gold></gold>.'
        - 'Ora che hai la tua ascia di legno, puoi {1} e {2} sui blocchi per fare la tua selezione.'
      stage-4-tasks:
        - 'Usa il comando {0} per ottenere la tua ascia di legno.'
    stage-5:
      stage-5-title: 'Disegna i contorni'
      stage-5-messages:
        - 'Ora che sappiamo di WorldEdit, possiamo tracciare i contorni dell''edificio.'
        - 'Per disegnare i contorni, utilizziamo il comando {0}.'
        - '{1} per selezionare il primo punto e {2} per selezionare il secondo punto.'
        - 'Per continuare a collegare i punti usando {0}. Riprova!'
      stage-5-tasks:
        - 'Collega i punti usando {0}.'
    stage-6:
      stage-6-title: 'Altezza Edificio'
      stage-6-messages:
        - 'Ora che abbiamo i contorni dell''edificio, abbiamo bisogno di <gold>misurare</gold> l''altezza dell''edificio.'
        - 'Calcolare l''altezza della facciata <gold></gold> sottraendo l''altezza del terreno <gold></gold> dall''altezza del tetto <gold></gold>.'
        - 'Inserire l''altezza (in metri) della facciata dell''edificio nella chat per continuare.'
        - '{0}'
        - 'Well done! The height of the building is {1} blocks.'
        - 'You´ve almost made it. The height of the building is {1} blocks.'
        - 'Hai quasi fatto questo. Riprova!'
        - 'Puoi §6leggere§f l''elevazione in Google Earth a §6in basso a destra§f della mappa.%newline%%newline%To §6misura§f altezza, muovi il puntatore del mouse §6§f sulla mappa.'
      stage-6-tasks:
        - 'Calcola l''altezza dell''edificio.'
    stage-7:
      stage-7-title: 'Conchiglie Da Costruzione'
      stage-7-messages:
        - 'Ora possiamo finalmente iniziare l''edificio! I primi passi sono i gusci, che ora possiamo iniziare con i contorni e le altezze dell''edificio.'
        - 'Teletrasportati ad almeno §6un punto§f della cresta del tetto a §6collega§f i punti con la facciata.'
        - 'Usa §6diversi tipi§f di blocchi e colori per le gusci per rendere più facile §6separare§f l''edificio in sezioni.'
        - 'In seguito, possiamo alzare le pareti e sigillare il tetto. Ora è il momento di segnare le finestre e le porte.'
        - 'Usa il comando WorldEdit §6{0}§f per alzare i muri in modo rapido e semplice.'
        - 'Riempi il tetto a mano o usa il comando WorldEdit §6{1}§f. In alternativa usa il comando §6{2}§f per cambiare la selezione per tetti più grandi e più complessi.'
        - 'Controlla sempre §6altezza§f delle finestre e delle porte in modo che §6corrisponda§f con la facciata.'
      stage-7-tasks:
        - 'Leggi tutti i suggerimenti sulla trama e contrassegnali come letti.'
    stage-8:
      stage-8-title: 'Finestre'
      stage-8-messages:
        - 'La conchiglia dell''edificio è fatta! Lasciate che rimanga con le finestre e le porte.'
        - 'Ohh... sembra che ci siano due finestre. Puoi aiutarmi a posizionarli? Hanno lo stesso aspetto del lato destro.'
        - 'Non dimentichi di §6oscurare§f le §6finestre§f e §6porte§f così non potrai vedere attraverso di loro. Noi non costruiamo interni!'
        - 'Ci sono molti modi per costruire finestre per BTE usando ad esempio §6banners§f, §6trapdoors§f o §6moquetti§f.'
        - 'Usa gli stessi blocchi delle finestre sulla destra. Riprova!'
        - 'Grazie per il tuo aiuto! Ora possiamo continuare con la texture.'
      stage-8-tasks:
        - 'Posiziona i dettagli della finestra mancanti.'
    stage-9:
      stage-9-title: 'Texturing'
      stage-9-messages:
