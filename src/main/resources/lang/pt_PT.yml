tutorials:
  stage: 'Etapa'
  new-stage-unlocked: 'NOVA ESTRELA DESBLOQUEADA'
  tutorial-completed: 'TUTORIAL CONCLUÍDO'
  beginner:
    stage-1:
      stage-1-title: 'Entendendo o Projeto BuildTheEarth'
      stage-1-messages:
        - 'Olá {0}! Bom te conhecer, meu nome é {1}. Você entra no mundo empolgante do projeto BuildTheEarth!'
        - 'Nossa missão é recriar todo o planeta Terra no Minecraft a uma escala de 1:1. Sim, você ouviu bem, a uma escala 1:1!'
        - 'No entanto, nós, nos Alps BTE, só somos responsáveis por recriar os belos países alpinos da Áustria, da Suíça e do Liechtenstein.'
        - 'Você está pronto para aprender a construir para o BTE? Eu vou guiá-lo através do básico para participar do projeto. Vamos nessas continuar!'
      stage-1-tasks:
        - 'Converse com {0} no local de construção.'
    stage-2:
      stage-2-title: 'Referências'
      stage-2-messages:
        - 'Bem-vindo à sua pequena ilha. Aqui vamos construir nosso primeiro edifício para o projeto Build The Earth!'
        - 'Antes de começarmos a construir, precisamos saber como fica o edifício da vida real. Para isso, usamos ferramentas como {0} e {1}.'
        - 'Usamos {2} para copiar coordenadas, então podemos teleportar para um ponto específico. Além disso, podemos aceder a {3} para que possamos olhar mais de perto para o edifício.'
        - '{4}'
        - 'Usamos {5} para medir a altura do prédio. Isso é importante para saber, então o edifício tem a altura correta.'
        - '{6}'
        - 'Use o comando {7} se você precisar dos links mais tarde.'
      stage-2-tasks:
    stage-3:
      stage-3-title: 'Teletransportando'
      stage-3-messages:
        - 'Os contornos de construção são gerados por padrão, mas como eles não são rigorosos, temos que corrigi-los. Para corrigir os contornos precisamos primeiro de teletransportar para as bordas do edifício.'
        - 'Use o comando {0} para teleportar para a localização no jogo. {1} em uma das bordas do edifício para copiar as coordenadas.'
        - '{2}'
        - 'Para continuar se teletransportando até os pontos marcados. Tente novamente!'
        - 'Alterne para §6Satélite§f ver no Google Maps para mostrar o prédio no 3D.%newline%%newline%Click em §6Camadas§f no canto inferior esquerdo do mapa. Se nenhum edifício 3D aparecer, habilite o §6Visão de Globe§f sob "Mais".'
      stage-3-tasks:
        - 'Teletransporte para todas as arestas {0} do edifício usando {1}.'
    stage-4:
      stage-4-title: 'MundoEditar'
      stage-4-messages:
        - 'Antes de continuarmos com os esboços, precisamos saber uma ferramenta importante chamada {0}. WorldEdit nos permite construir mais rápido e eficientemente.'
        - 'Para usar o WorldEdit, você precisa obter um <gold>machado de madeira</gold>.'
        - 'Agora que você tem seu machado de madeira, você pode {1} e {2} em blocos para fazer sua seleção.'
      stage-4-tasks:
        - 'Use o comando {0} para pegar seu machado de madeira.'
    stage-5:
      stage-5-title: 'Desenhar os contornos'
      stage-5-messages:
        - 'Agora que sabemos sobre o WorldEdit, podemos traçar os contornos do edifício.'
        - 'Para desenhar o esboço, usamos o comando {0}.'
        - '{1} para selecionar o primeiro ponto e {2} para selecionar o segundo ponto.'
        - 'Para continuar conectando os pontos usando {0}. Tente novamente!'
      stage-5-tasks:
        - 'Conecte os pontos usando {0}.'
    stage-6:
      stage-6-title: 'Montar alturas'
      stage-6-messages:
        - 'Agora que temos os contornos da construção, precisamos <gold>medir</gold> a altura do edifício.'
        - 'Calculate the height of the <gold>facade</gold> by subtracting the height of the <gold>ground</gold> from the height of the <gold>roof</gold>.'
        - 'Digite a altura (em metros) da fachada de construção no chat para continuar.'
        - '{0}'
        - 'Muito bem! A altura do prédio são blocos {1}.'
        - 'You´ve almost made it. The height of the building is {1} blocks.'
        - 'Você mostra quase isso. Tente de novo!'
        - 'Você pode §6ler§f a elevação no Google Earth na §6inferior direita§f do mapa.%newline%%newline%To §6mediu§f a altura, mova seu §6ponteiro do mouse§f no mapa.'
      stage-6-tasks:
        - 'Calcule a altura do prédio.'
    stage-7:
      stage-7-title: 'Construindo Projéteis'
      stage-7-messages:
        - 'Agora podemos finalmente começar a construir! Os primeiros passos são os projécteis, que agora podemos começar com os contornos e construir a altura.'
        - 'Teleporte para pelo menos §6um ponto§f do telhado para §6conectar§f o(s) ponto(s) com a factura.'
        - 'Use §6tipos diferentes§f de blocos e cores para as conchas para facilitar a §6separar§f o prédio em seções.'
        - 'Em seguida, podemos levantar as paredes e selar o telhado. Agora é hora de marcar as janelas e portas.'
        - 'Use o comando WorldEdit §6{0}§f para levantar as paredes de forma rápida e fácil.'
        - 'Preencha o telhado à mão ou use o comando WorldEdit §6{1}§f. Como alternativa, use o comando §6{2}§f para mudar a seleção para telhados maiores e mais complexos.'
        - 'Sempre verifique a altura §6das janelas e portas para que §6correspondes§f com a fachada.'
      stage-7-tasks:
        - 'Leia todas as dicas no gráfico e marque-as como lidas.'
    stage-8:
      stage-8-title: 'Janelas'
      stage-8-messages:
        - 'O cartucho está pronto! Permita que você continue com as janelas e portas.'
        - 'Ohh... parece que há duas janelas faltando. Você pode me ajudar a colocá-las? Elas têm a aparência do lado direito.'
        - 'Dano! Você esqueceu de §6escurecer§f as §6janelas§f e §6portas§f para que você possa ver através delas. Nós divirtimos interiores!'
        - 'Há muitas maneiras de construir janelas para BTE usando por exemplo §6estandartes§f, §6portas de armadilha§f ou §6carpets§f.'
        - 'Use os mesmos blocos que para as janelas à direita. Tente novamente!'
        - 'Obrigado pela sua ajuda! Agora podemos continuar com a texturação.'
      stage-8-tasks:
        - 'Coloque os detalhes da janela que faltam.'
    stage-9:
      stage-9-title: 'Texturização'
      stage-9-messages:
        - 'A texturação é uma parte integral do processo de construção. É importante usar os blocos e cores certos para fazer o edifício parecer realista.'
