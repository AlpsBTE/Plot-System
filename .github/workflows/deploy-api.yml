name: Build and Deploy Plot System API

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'plot-system-api/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew :plot-system-api:build

      - name: Deploy Plot System API to Maven repository
        run: ./gradlew :plot-system-api:publish
        env:
          ORG_GRADLE_PROJECT_alpsMavenUser: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_alpsMavenPassword: ${{ secrets.MAVEN_PASSWORD }}